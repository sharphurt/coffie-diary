spring.application.name=coffee-diary
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/coffee}
spring.datasource.username=${POSTGRES_USER:coffee}
spring.datasource.password=${POSTGRES_PASSWORD}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=never
app.owner-login=${OWNER_LOGIN:owner}
app.owner-password=${OWNER_PASSWORD}
app.media-path=${MEDIA_PATH:./data/media}
