services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coffee
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports: ["${APP_BIND:-127.0.0.1:8080}:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/coffee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OWNER_LOGIN: ${OWNER_LOGIN:-owner}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD in .env}
      MEDIA_PATH: /data/media
      SERVER_ADDRESS: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - media:/data/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres:
  media:
